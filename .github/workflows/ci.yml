name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and screenshots
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore NWpfThemes.sln

      - name: Build
        run: dotnet build NWpfThemes.sln -c Release --no-restore

      - name: Test
        run: dotnet test NWpfThemes.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Capture gallery screenshots
        shell: pwsh
        run: |
          $exe = "samples/NWpfThemes.Gallery/bin/Release/net10.0-windows/NWpfThemes.Gallery.exe"
          $out = Join-Path $PWD "screenshots"
          $process = Start-Process -FilePath $exe -ArgumentList "--screenshots", "`"$out`"" -Wait -PassThru
          if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
          if ($process.ExitCode -ne 0) { throw "Gallery exited with code $($process.ExitCode)" }
          "### Gallery screenshots" >> $env:GITHUB_STEP_SUMMARY
          "Download the **screenshots** artifact of this run to see every theme." >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem $out -Filter *.png | ForEach-Object { "- $($_.Name) ($([math]::Round($_.Length / 1KB)) KB)" >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Pack
        run: dotnet pack src/NWpfThemes/NWpfThemes.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/
