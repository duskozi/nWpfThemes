name: Publish to NuGet

# Push a tag like v1.2.3 or v1.2.3-beta.1 to publish that version.
# Uses NuGet Trusted Publishing: GitHub issues a short-lived token, so no API key is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '${{ github.ref_name }}' must look like v1.2.3 or v1.2.3-beta.1"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build NWpfThemes.sln -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test NWpfThemes.sln -c Release --no-build

      - name: Pack
        run: dotnet pack src/NWpfThemes/NWpfThemes.csproj -c Release --no-build -o artifacts -p:Version=${{ env.VERSION }}

      - name: Log in to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/
